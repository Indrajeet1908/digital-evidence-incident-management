# ==============================================================================
# Digital Evidence Platform - Reverse Proxy Routing Configuration
# ==============================================================================

upstream backend_service {
    server backend:5000;
    keepalive 32;
}

upstream frontend_service {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Client upload payload boundary matching platform MAX_EVIDENCE_FILE_SIZE_MB
    client_max_body_size 100M;

    # Pass client correlation ID or generate request ID
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. API Route Group
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Extended timeouts for large evidence uploads, AI processing, and PDF generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming file downloads
        proxy_buffering off;
    }

    # 2. Static Frontend & SPA Fallback Route Group
    location / {
        proxy_pass http://frontend_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
