name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Regression Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ep_user
          POSTGRES_PASSWORD: ep_dev_password_2024
          POSTGRES_DB: evidence_platform_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://ep_user:ep_dev_password_2024@localhost:5433/evidence_platform_db
      JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_length_secure!
      JWT_EXPIRES_IN: 24h
      MAX_EVIDENCE_FILE_SIZE_MB: 100
      EVIDENCE_STORAGE_PATH: storage/evidence
      AI_PROVIDER: mock
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ─── Server Pipeline ──────────────────────────────
      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Deploy schema to CI test database
        working-directory: server
        run: npx prisma db push --skip-generate

      - name: Seed test roles
        working-directory: server
        run: npx prisma db seed

      - name: Run complete regression suite (11 suites)
        working-directory: server
        run: npm test

      - name: Build backend application
        working-directory: server
        run: npm run build

      # ─── Client Pipeline ──────────────────────────────
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend application
        working-directory: client
        run: npm run build
