# ==============================================================================
# Digital Evidence Platform - Production Multi-Container Orchestration
# ==============================================================================
# Usage:
#   1. Deploy migrations:
#      docker compose -f docker-compose.production.yml run --rm backend npx prisma migrate deploy
#   2. Start services:
#      docker compose -f docker-compose.production.yml up -d
#   3. Stop services:
#      docker compose -f docker-compose.production.yml down
# ==============================================================================

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: dep-prod-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - frontend-net
      - backend-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dep-prod-frontend
    restart: unless-stopped
    networks:
      - frontend-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dep-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MAX_EVIDENCE_FILE_SIZE_MB: ${MAX_EVIDENCE_FILE_SIZE_MB:-100}
      EVIDENCE_STORAGE_PATH: storage/evidence
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_AI_INPUT_CHARACTERS: ${MAX_AI_INPUT_CHARACTERS:-50000}
    volumes:
      # Persistent local storage for digital evidence artifacts
      - evidence-data:/app/storage/evidence
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend-net
      - db-net

  postgres:
    image: postgres:16-alpine
    container_name: dep-prod-postgres
    restart: unless-stopped
    # Security: No ports mapped to host. Accessible ONLY internally via db-net.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

networks:
  frontend-net:
    internal: true
  backend-net:
    internal: true
  db-net:
    internal: true

volumes:
  pgdata-prod:
    name: dep_postgres_prod_data
  evidence-data:
    name: dep_evidence_prod_data
