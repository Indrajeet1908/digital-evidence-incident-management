# ============================================
# Digital Evidence Platform - Docker Services
# ============================================
# Starts PostgreSQL for local development.
#
# Usage:
#   docker compose up -d      (start in background)
#   docker compose down       (stop)
#   docker compose logs -f db (view database logs)
# ============================================

services:
  db:
    image: postgres:16-alpine
    container_name: dep-postgres
    restart: unless-stopped
    ports:
      # Host port 5433 → Container port 5432
      # Using 5433 to avoid conflict with any local PostgreSQL on 5432
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ep_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ep_dev_password_2024}
      POSTGRES_DB: ${DB_NAME:-evidence_platform_db}
    volumes:
      # Named volume for persistent data — survives container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ep_user} -d ${DB_NAME:-evidence_platform_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
